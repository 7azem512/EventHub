spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: file:///D:/EventHub/config-repo
          default-label: main

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true